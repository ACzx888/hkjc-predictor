# Form scoring: placing → points (averaged over last N starts)
form:
  max_starts: 6
  placing_points:
    1: 100
    2: 85
    3: 72
    4: 58
    5: 48
    6: 40
    7: 32
    8: 25
    9: 18
    10: 12
  default_placing: 8   # for missing / DNF-like
  no_form_score: 40

# Rating: map official rating bands to 0–100, then adjust by change
rating:
  min_rating: 20
  max_rating: 130
  change_bonus_per_point: 1.5   # +rating change boosts score
  change_cap: 15

# Weight: lighter is slightly better; claim reduces effective weight
weight_claim:
  baseline_kg: 57.0
  kg_penalty: 3.0        # points lost per kg above baseline
  claim_bonus: 2.0       # points gained per kg claimed
  min_score: 25
  max_score: 95

# Going / gear (optional fields)
going_gear:
  default: 50
  soft_suitable: 70
  firm_suitable: 70
  gear_positive: 60      # blinkers first-time etc. mild positive if flagged

# Softmax confidence (tunable). Score stays 0–100 fundamentals; Conf % is
# field-relative win probability via softmax(score / temperature).
# Race confidence blends (top1−top2) gap and probability entropy → 0–100 + High/Med/Low.
confidence:
  temperature: 8.0       # lower = sharper favourite; higher = flatter field
  gap_scale: 10.0        # score gap of this magnitude → strong gap contribution
  gap_weight: 0.6
  entropy_weight: 0.4
  high_threshold: 70     # Race confidence ≥ this → High
  med_threshold: 45      # ≥ this → Med; else Low
