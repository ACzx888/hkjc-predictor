[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hkjc-predictor"
version = "0.1.0"
description = "HKJC horse racing tip sheets from fundamental condition analysis (no odds)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]

[project.scripts]
hkjc-predictor = "hkjc_predictor.cli:main"
hkjc-web = "hkjc_predictor.web.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
hkjc_predictor = ["horseQuery.graphql", "web/templates/*.html"]
