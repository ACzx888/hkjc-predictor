# Cloudflare Pages — documented settings (Dashboard also sets build/output).
# Build command:  bash scripts/cf_pages_build.sh
# Output directory: dist
#
# After first deploy, create a Deploy Hook and set Pages env:
#   DEPLOY_HOOK_URL = <hook URL>   (for functions/api/refresh.js)
#
# Do NOT put real hook URLs in this file.

name = "hkjc-predictor"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

# [vars]
# DEPLOY_HOOK_URL is a secret — set in Cloudflare Dashboard → Settings → Environment variables
