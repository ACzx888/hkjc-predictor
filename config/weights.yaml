# Scoring weights for fundamental condition analysis (must sum ~1.0)
# All factors are 0–100 internally; final score is weighted average.

weights:
  recent_form: 0.28          # last 6 placings (1=win … higher=worse)
  course_distance_fit: 0.18  # CD / C / D win-place record proxies
  draw_bias: 0.12            # HV vs ST, turf vs AWT heuristics
  jockey: 0.10               # jockey ability proxy (win% / rating band)
  trainer: 0.08              # trainer ability proxy
  rating: 0.14               # official rating + recent change
  weight_claim: 0.07         # carried weight & apprentice claims
  going_gear: 0.03           # going suitability & gear notes if present

# Draw bias tables: score contribution before weight (0–100 scale)
# Higher = more favourable draw for that track/surface.
draw_bias:
  HV:
    turf:
      # Happy Valley turf: inner draws often favoured on shorter turns
      preferred_low: true
      # draw -> base score
      scores: {1: 95, 2: 90, 3: 85, 4: 78, 5: 70, 6: 62, 7: 52, 8: 42, 9: 35, 10: 28, 11: 22, 12: 18, 13: 14, 14: 10}
    awt:
      preferred_low: true
      scores: {1: 88, 2: 84, 3: 80, 4: 74, 5: 68, 6: 60, 7: 52, 8: 44, 9: 38, 10: 32, 11: 26, 12: 20}
  ST:
    turf:
      # Sha Tin turf: less extreme; mid-to-low often fine
      preferred_low: false
      scores: {1: 72, 2: 78, 3: 82, 4: 85, 5: 88, 6: 90, 7: 88, 8: 84, 9: 78, 10: 72, 11: 65, 12: 58, 13: 50, 14: 42}
    awt:
      preferred_low: true
      scores: {1: 90, 2: 86, 3: 82, 4: 76, 5: 70, 6: 62, 7: 54, 8: 46, 9: 40, 10: 34, 11: 28, 12: 22}

# Jockey / trainer proxy tiers (name substring or exact match → score)
